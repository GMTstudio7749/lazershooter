<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Canvas Game: Boids Swarm & Skeletons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="rgb-border"></div>

    <div class="instructions">
        <strong>HỆ THỐNG PHÒNG THỦ KHÔNG GIAN</strong><br>
        • <b>Di chuyển:</b> WASD / Phím mũi tên (Né đạn Skeleton)<br>
        • <b>Bắn Laser:</b> Giữ [Chuột trái] (Thiêu đốt mục tiêu)<br>
        • <b>Kỹ năng [SPACEBAR]:</b> Sóng xung kích đẩy lùi bầy đàn Boids<br>
        • <b>Hệ thống:</b> Sống sót qua 3 Level để WIN. Thua bấm <b>[R]</b> để chơi lại.
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
